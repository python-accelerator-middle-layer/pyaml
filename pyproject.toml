[project]
name = "accelerator-middle-layer"
description = "Joint technology platform for design, commissioning and operation of particle accelerators."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "particle accelerator",
    "accelerator physics",
    "accelerator middle layer",
    "accelerator control",
    "accelerator modeling",
    "accelerator design",
    "accelerator operation",
    "accelerator commissioning",
    "beam dynamics",
    "synchrotron",
    "storage ring",
    "machine tuning",
    "digital twin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.3",
    "accelerator-toolbox>=0.6.1",
    "PyYAML>=6.0.2",
    "pydantic>=2.11.7",
    "accelerator-commissioning==1.5.3", #pySC
    "h5py",
    "matplotlib",
    "pint>=0.24"
]

[project.optional-dependencies]

tango-pyaml = [
    "tango-pyaml",
]

cs-oa-epics = [
    "pyaml-cs-oa[epics]",
]

cs-oa-tango = [
    "pyaml-cs-oa[tango]",
]

test = [
    "pytest>=7.4",
    "pytest-cov>=3.0",
    "pyaml-test-lattice>=0.2.0",
    "jsonschema>=4.18",
]
doc = [
    "sphinx ~= 8.1",
    "myst-parser",
    "myst-nb",
    "pydata-sphinx-theme",
    "sphinx_design",
    "sphinx-copybutton",
]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "pytest",
]

[project.urls]
Homepage = "https://python-accelerator-middle-layer.github.io/"
Documentation = "https://pyaml.readthedocs.io/en/stable/"
Repository = "https://github.com/python-accelerator-middle-layer/pyaml.git"
Issues = "https://github.com/python-accelerator-middle-layer/pyaml/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["pyaml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.vcs]
version-file = "pyaml/_version.py"

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
# Basic, sane default set: pycodestyle (E,W), pyflakes (F),
# bugbear (B), imports (I), etc.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "I",  # isort-style import sorting
]
ignore = [
    "E203",  # so it's compatible with black-style formatting
    "F401",  # unused imports
    "F841",  # unused local variables
    "E741",  # ambiguous variable name
    "B024",  # abstract class with no methods
]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring an external integration runtime",
]
