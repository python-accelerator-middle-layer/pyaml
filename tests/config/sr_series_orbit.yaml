- type: pyaml.diagnostics.bpm.bpm
  name: BPM_C05-03
- type: pyaml.diagnostics.bpm.bpm
  name: BPM_C05-04
- type: pyaml.diagnostics.bpm.bpm
  name: BPM_C05-05
