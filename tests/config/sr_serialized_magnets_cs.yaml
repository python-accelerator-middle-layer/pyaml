type: pyaml.accelerator
facility: ESRF
machine: sr
energy: 6e9
simulators:
  - type: pyaml.lattice.simulator
    lattice: sr/lattices/ebs.mat
    name: design
controls:
  - type: tango.pyaml.controlsystem
    tango_host: ebs-simu-3:10000
    name: live
    catalog:
      type: tango.pyaml.tango_catalog
data_folder: /data/store
arrays:
  - type: pyaml.arrays.magnet
    name: ALL_SERIALIZED
    elements:
      - QF1A-C*
      - QD2A-C*
devices:
  - type: pyaml.magnet.serialized_magnet
    name: QF1A
    function: B1
    elements:
      - QF1A-C05
      - QF1A-C06
      - QF1A-C07
      - QF1A-C08
    model:
      type: pyaml.magnet.linear_serialized_model
      calibration_factors: [1.0, 1.01, 0.99, 1.02]
      calibration_offsets: 0.0
      unit: m-1
      hardware_unit: A
      curves:
        type: pyaml.magnet.csvcurve
        file: sr/magnet_models/QF1_strength.csv
      powerconverter: srmag/ps-qf1a/series/current
  - type: pyaml.magnet.serialized_magnet
    name: QD2A
    function: B1
    elements:
      - QD2A-C05
      - QD2A-C06
      - QD2A-C07
    model:
      type: pyaml.magnet.linear_serialized_model
      calibration_factors: 1.0
      calibration_offsets: 0.0
      unit: m-1
      hardware_unit: A
      curves:
        type: pyaml.magnet.csvcurve
        file: sr/magnet_models/QD2_strength.csv
      powerconverter: srmag/ps-qd2a/series/current
