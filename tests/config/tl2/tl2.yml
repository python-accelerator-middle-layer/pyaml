type: pyaml.accelerator
facility: ESRF
machine: tl2
energy: 6e9

simulators:
  - class: pyaml.lattice.simulator.Simulator
    lattice: tl2.mat
    name: design
    twiss_in:
      class: pyaml.lattice.twiss_in.TwissIn
      alpha: [-1.71,  1.47]
      beta: [5.9 , 5.65]
      dispersion: [-0.145, -0.092, 0, 0]

data_folder: /data/store

arrays:

  - type: pyaml.arrays.magnet
    name: HCORR
    elements:
      - CH*
  - type: pyaml.arrays.magnet
    name: VCORR
    elements:
      - CV*
  - type: pyaml.arrays.bpm
    name: BPMS
    elements:
      - BPM*

devices:

  - class: pyaml.tuning_tools.orbit.Orbit
    bpm_array_name: BPMS
    hcorr_array_name: HCORR
    vcorr_array_name: VCORR
    name: DEFAULT_ORBIT_CORRECTION
    singular_values: 5
    response_matrix: ideal_tl2_orm.json

  - class: pyaml.tuning_tools.orbit_response_matrix.OrbitResponseMatrix
    bpm_array_name: BPMS
    hcorr_array_name: HCORR
    vcorr_array_name: VCORR
    corrector_delta: 1e-6
    name: DEFAULT_ORBIT_RESPONSE_MATRIX

  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_CV1
    x_pos: tl2/d-bpm/cv1/X_Position
    y_pos: tl2/d-bpm/cv1/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_CH3
    x_pos: tl2/d-bpm/d2/X_Position
    y_pos: tl2/d-bpm/d2/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_QD5
    x_pos: tl2/d-bpm/q5/X_Position
    y_pos: tl2/d-bpm/q5/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_QF6
    x_pos: tl2/d-bpm/q6/X_Position
    y_pos: tl2/d-bpm/q6/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_SX
    x_pos: tl2/d-bpm/sx/X_Position
    y_pos: tl2/d-bpm/sx/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_QD8
    x_pos: tl2/d-bpm/q8/X_Position
    y_pos: tl2/d-bpm/q8/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_QD12
    x_pos: tl2/d-bpm/q12/X_Position
    y_pos: tl2/d-bpm/q12/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_QF14
    x_pos: tl2/d-bpm/q14/X_Position
    y_pos: tl2/d-bpm/q14/Z_Position
  - class: pyaml.diagnostics.bpm.bpm.BPM
    name: BPM_S1PM
    x_pos: tl2/d-bpm/s1pm/X_Position
    y_pos: tl2/d-bpm/s1pm/Z_Position

  - class: pyaml.magnet.hcorrector.HCorrector
    name: CH1
    model:
      class: pyaml.magnet.linear_model.LinearMagnetModel
      calibration_factor: 3.222e-3
      unit: 1/m
      hardware_unit: A
      powerconverter: tl2/ps-c1/ch1/Current
